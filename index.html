<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="calculator__display">
                0
            </div>
            
            <div class="calculator__input-area">
                <div class="row-1" id="col-deg-opt" >
                    <button class="adv-btn-style">DEG</button>
                    <button class="adv-btn-style">F-E</button>
                </div>
                 <div class="row-2" id="col-adv-opt">
                    <button class="col" id="col-mc-style">MC</button>
                    <button class="col" id="col-mr-style">MR</button>
                    <button class="col">M+</button>
                    <button class="col">M-</button>
                    <button class="col">MS</button>
                </div>
                <div class="row-advance-fun" >
                    <button class="adv-btn-style">
                        <img src="svgs/trigno.svg" alt="trignometry symbol" height="20px" width="20px">
                        <span>Trignometry</span>
                        <img src="svgs/arrow.svg" alt="trignometry symbol" height="20px" width="20px">
                    </button>
                    <button class="adv-btn-style">
                        <img src="svgs/function.svg" alt="trignometry symbol" height="20px" width="20px">
                        <span>Function</span>
                        <img src="svgs/arrow.svg" alt="trignometry symbol" height="20px" width="20px">
                    </button>
                </div>
                <div class="row">
                    <button class="col">2 <sup>nd</sup></button>
                    <button class="col">π</button>
                    <button class="col">e</button>
                    <button class="col">C</button>
                    <button class="col"><img src="svgs/cross.svg" alt="cross"></button>
                </div>
                <div class="row">
                    <button class="col">x<sup>2</sup></button>
                    <button class="col">1/x</button>
                    <button class="col">|x|</button>
                    <button class="col">exp</button>
                    <button class="col">mod</button>
                </div>
                <div class="row">
                    <button class="col">2x</button>
                    <button class="col">(</button>
                    <button class="col">)</button>
                    <button class="col">n!</button>
                    <button class="col" value="/">÷</button>
                </div>
                <div class="row">
                    <button class="col">x<sup>y</sup></button>
                    <button class="col" id="col-num-style">7</button>
                    <button class="col" id="col-num-style">8</button>
                    <button class="col" id="col-num-style">9</button>
                    <button class="col" value="*">x</button>
                </div>
                <div class="row">
                    <button class="col">10<sup>x</sup></button>
                    <button class="col" id="col-num-style">4</button>
                    <button class="col" id="col-num-style">5</button>
                    <button class="col" id="col-num-style">6</button>
                    <button class="col" value="-">−</button>
                </div>
                <div class="row">
                    <button class="col">log</button>
                    <button class="col" id="col-num-style">1</button>
                    <button class="col" id="col-num-style">2</button>
                    <button class="col" id="col-num-style">3</button>
                    <button class="col">+</button>
                </div>
                <div class="row">
                    <button class="col">in</button>
                    <button class="col" id="col-num-style">+/-</button>
                    <button class="col" id="col-num-style">0</button>
                    <button class="col" id="col-num-style">.</button>
                    <button class="col" id="equals-style">=</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
